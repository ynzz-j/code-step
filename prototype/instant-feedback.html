<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CodeStep - 即时激励 UI 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

  /* 金色脉冲边框 */
  @keyframes golden-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.4); border-color: rgba(255,215,0,0.6); }
    50%       { box-shadow: 0 0 24px rgba(255,215,0,0.9), 0 0 48px rgba(255,165,0,0.5); border-color: rgba(255,215,0,1); }
  }
  .perfect-border {
    border: 2px solid;
    animation: golden-pulse 0.8s ease-in-out 4;
  }

  /* 完美一击徽章入场 */
  @keyframes badge-in {
    0%   { opacity: 0; transform: translateY(-30px) scale(0.7); }
    60%  { opacity: 1; transform: translateY(4px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .perfect-badge {
    animation: badge-in 0.5s ease-out forwards;
  }

  /* 粒子爆炸 */
  @keyframes particle-burst {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: particle-burst 1.2s ease-out forwards;
  }

  /* 终点发光 */
  @keyframes dot-glow {
    0%, 100% { r: 3; opacity: 0.8; }
    50%        { r: 6; opacity: 1; }
  }

  /* 滑动入场 */
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- 顶部导航 -->
<div class="flex items-center justify-between px-5 py-2.5 bg-gray-800/40 border-b border-gray-700/40 text-sm">
  <button class="text-gray-400 hover:text-gray-200 transition-colors">&larr; 退出</button>
  <span class="font-medium text-gray-300">Python 基础 — 变量与类型</span>
  <div class="flex items-center gap-1.5">
    <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
  </div>
</div>

<!-- 连击展示区 -->
<div id="combo-bar" class="flex items-center justify-center gap-3 py-2 bg-gray-900/50 border-b border-gray-700/30 transition-all duration-300">
  <span class="text-2xl font-bold text-blue-400 combo-glow-mid" id="combo-text">12 连击</span>
  <span class="text-xs text-gray-500" id="combo-label">高手</span>
</div>

<!-- 主内容区 -->
<div class="flex-1 flex overflow-hidden">

  <!-- 左侧：指令面板 -->
  <div class="w-72 flex-shrink-0 p-5 border-r border-gray-700/30 bg-gray-800/20 overflow-auto">
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-2">
        <span class="px-2 py-0.5 text-[11px] font-medium bg-blue-500/20 text-blue-300 rounded">步骤 2/8</span>
        <span class="px-2 py-0.5 text-[11px] font-medium bg-green-500/20 text-green-300 rounded">typing</span>
      </div>
      <h2 class="text-base font-semibold text-gray-100 mb-2">打印变量值</h2>
      <p class="text-sm text-gray-400 leading-relaxed">使用 <code class="text-xs bg-gray-700/60 px-1 py-0.5 rounded text-cyan-300">print()</code> 函数输出变量内容到控制台。</p>
    </div>
    <div class="p-3 rounded-lg bg-blue-500/5 border border-blue-500/20">
      <div class="text-xs text-blue-400 mb-1.5 font-medium">💡 提示</div>
      <p class="text-xs text-gray-400">注意括号和引号都是英文符号。</p>
    </div>
  </div>

  <!-- 右侧：编辑器 + 图表 + 完美一击 -->
  <div class="flex-1 flex flex-col relative" id="editor-container">

    <!-- 完美一击徽章（默认隐藏） -->
    <div id="perfect-badge" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-30 perfect-badge">
      <div class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-gradient-to-r from-yellow-500/90 to-amber-500/90 text-gray-900 font-bold text-sm shadow-lg shadow-yellow-500/30">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        完美一击！Perfect Strike!
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
      </div>
    </div>

    <!-- 粒子容器（默认隐藏） -->
    <div id="particles-container" class="hidden absolute inset-0 pointer-events-none z-20"></div>

    <!-- 右上角：WPM/准确率图表 -->
    <div class="absolute top-3 right-3 z-20 w-64 bg-gray-800/90 backdrop-blur-sm rounded-xl border border-gray-700/50 shadow-lg shadow-black/30 animate-slide-up">
      <div class="flex items-center justify-between px-3 py-2 border-b border-gray-700/30">
        <span class="text-xs font-medium text-gray-300">📈 实时表现</span>
        <button class="text-gray-500 hover:text-gray-300 text-xs" id="btn-collapse">─</button>
      </div>
      <div class="p-3" id="chart-body">
        <svg viewBox="0 0 220 100" class="w-full" id="chart-svg">
          <!-- 网格线 -->
          <line x1="0" y1="25" x2="220" y2="25" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
          <line x1="0" y1="50" x2="220" y2="50" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
          <line x1="0" y1="75" x2="220" y2="75" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
          <!-- WPM 折线 -->
          <polyline id="wpm-line" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
          <!-- 准确率 折线 -->
          <polyline id="acc-line" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>
          <!-- 终点发光圆点 WPM -->
          <circle id="wpm-dot" cx="0" cy="0" fill="#3b82f6" class="animate-pulse" style="animation: dot-glow 1.2s ease-in-out infinite;">
            <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
          </circle>
          <!-- 终点发光圆点 ACC -->
          <circle id="acc-dot" cx="0" cy="0" fill="#10b981" class="animate-pulse" style="animation: dot-glow 1.2s ease-in-out infinite;">
            <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
          </circle>
          <!-- 标签 -->
          <text x="4" y="22" fill="#3b82f6" font-size="9">WPM</text>
          <text x="4" y="95" fill="#10b981" font-size="9">ACC%</text>
        </svg>
        <div class="flex items-center justify-between mt-1.5 text-xs">
          <span class="text-blue-400 font-bold" id="wpm-now">— WPM</span>
          <span class="text-green-400 font-bold" id="acc-now">—% ACC</span>
        </div>
      </div>
    </div>

    <!-- 代码编辑区 -->
    <div class="flex-1 overflow-auto p-5 font-mono text-lg leading-relaxed cursor-text bg-gray-900/20" id="code-area">
      <div id="code-render" class="whitespace-pre-wrap"></div>
    </div>

    <!-- 底部统计 -->
    <div class="px-5 py-2 bg-gray-800/40 border-t border-gray-700/30 flex items-center gap-5 text-xs text-gray-400">
      <span>WPM: <span class="text-blue-400 font-semibold" id="stat-wpm">0</span></span>
      <span>准确率: <span class="text-green-400 font-semibold" id="stat-acc">100%</span></span>
      <span>错误: <span class="text-red-400 font-semibold" id="stat-err">0</span></span>
      <span class="ml-auto">进度: <span id="stat-progress">0/36</span></span>
    </div>

  </div>
</div>

<!-- 底部导航 -->
<div class="flex items-center justify-between px-5 py-2 bg-gray-800/40 border-t border-gray-700/40 text-sm">
  <button class="text-gray-400 hover:text-gray-200 disabled:opacity-30" disabled>← 上一步</button>
  <span class="text-gray-500 text-xs">2 / 8</span>
  <button class="text-gray-400 hover:text-gray-200" id="btn-next">下一步 →</button>
</div>

<!-- 操作按钮区 -->
<div class="fixed bottom-20 left-1/2 -translate-x-1/2 flex gap-3 z-40">
  <button onclick="triggerPerfect()" class="px-4 py-2 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 rounded-lg border border-yellow-500/30 text-sm font-medium transition-all">
    ⭐ 模拟完美一击
  </button>
  <button onclick="resetPerfect()" class="px-4 py-2 bg-gray-700/50 hover:bg-gray-700/70 text-gray-300 rounded-lg border border-gray-600/40 text-sm font-medium transition-all">
    ♻️ 重置
  </button>
</div>

<script>
// ========== 数据模拟 ==========
const TARGET = 'print(x)\nprint(y)\nprint("Hello")';
let typed = '';
let cursor = 0;
let backspaceCount = 0;
let wpmHistory = [];
let accHistory = [];
let timeElapsed = 0;
let correctCount = 0;
let totalCount = 0;
let chartCollapsed = false;

// 初始化图表假数据
for (let i = 0; i < 30; i++) {
  const t = i / 29;
  wpmHistory.push(Math.round(30 + 50 * Math.sin(t * 3) * (0.5 + t * 0.5) + Math.random() * 10));
  accHistory.push(Math.round(85 + 15 * (t * t) + Math.random() * 5));
}
wpmHistory = wpmHistory.map(v => Math.min(v, 120));
accHistory = accHistory.map(v => Math.min(v, 100));

// ========== 渲染代码 ==========
function renderCode() {
  const el = document.getElementById('code-render');
  let html = '';
  for (let i = 0; i < TARGET.length; i++) {
    const ch = TARGET[i];
    const isTyped = i < typed.length;
    const isCurrent = i === cursor;
    const isCorrect = isTyped && typed[i] === ch;
    const isWrong = isTyped && typed[i] !== ch;
    let cls = 'text-gray-500';
    if (isCorrect) cls = 'text-green-400';
    else if (isWrong) cls = 'text-red-400 bg-red-500/20';
    else if (isCurrent) cls = 'text-gray-200 bg-blue-500/30';
    let display = ch === '\n' ? '↵\n' : ch === ' ' ? '·' : ch;
    html += `<span class="${cls}">${display}</span>`;
  }
  el.innerHTML = html;
}

// ========== 更新图表 ==========
function updateChart() {
  const svg = document.getElementById('chart-svg');
  const wpmLine = document.getElementById('wpm-line');
  const accLine = document.getElementById('acc-line');
  const wpmDot = document.getElementById('wpm-dot');
  const accDot = document.getElementById('acc-dot');

  const w = 220, h = 100;
  const pad = 8;

  // WPM 折线 (0~130)
  let wpmPts = wpmHistory.map((v, i) => {
    const x = pad + (i / (wpmHistory.length - 1)) * (w - pad * 2);
    const y = pad + (1 - v / 130) * (h - pad * 2);
    return `${x},${y}`;
  }).join(' ');
  wpmLine.setAttribute('points', wpmPts);

  // ACC 折线 (0~100)
  let accPts = accHistory.map((v, i) => {
    const x = pad + (i / (accHistory.length - 1)) * (w - pad * 2);
    const y = pad + (1 - v / 100) * (h - pad * 2);
    return `${x},${y}`;
  }).join(' ');
  accLine.setAttribute('points', accPts);

  // 终点圆点
  const lastWpm = wpmHistory[wpmHistory.length - 1];
  const lastAcc = accHistory[accHistory.length - 1];
  const lastX = w - pad;
  const wpmY = pad + (1 - lastWpm / 130) * (h - pad * 2);
  const accY = pad + (1 - lastAcc / 100) * (h - pad * 2);
  wpmDot.setAttribute('cx', String(lastX));
  wpmDot.setAttribute('cy', String(wpmY));
  accDot.setAttribute('cx', String(lastX));
  accDot.setAttribute('cy', String(accY));

  // 数值更新
  document.getElementById('wpm-now').textContent = `${lastWpm} WPM`;
  document.getElementById('acc-now').textContent = `${lastAcc}% ACC`;
}

// ========== 模拟打字 ==========
function typeChar() {
  if (cursor >= TARGET.length) return;
  const expected = TARGET[cursor];
  // 90% 正确率模拟
  const isCorrect = Math.random() < 0.9;
  if (isCorrect) {
    typed += expected;
    correctCount++;
  } else {
    typed += expected === '(' ? ')' : expected === '"' ? "'" : 'a';
  }
  totalCount++;
  cursor++;
  renderCode();
  updateStats();
  // 更新图表数据（每3个字符加一个点）
  if (cursor % 3 === 0 && wpmHistory.length < 60) {
    const wpm = Math.round(30 + Math.random() * 80 + (cursor / TARGET.length) * 30);
    const acc = Math.round((correctCount / totalCount) * 100);
    wpmHistory.push(Math.min(wpm, 130));
    accHistory.push(Math.min(acc, 100));
    updateChart();
  }
  // 自动滚动
  if (cursor >= TARGET.length) {
    if (backspaceCount === 0) {
      setTimeout(triggerPerfect, 400);
    }
  }
}

function updateStats() {
  const wpm = Math.round(correctCount / 5 * 60 / Math.max(1, (Date.now() - startTime) / 60000));
  const acc = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 100;
  document.getElementById('stat-wpm').textContent = wpm;
  document.getElementById('stat-acc').textContent = acc + '%';
  document.getElementById('stat-err').textContent = totalCount - correctCount;
  document.getElementById('stat-progress').textContent = `${cursor}/${TARGET.length}`;
  // combo
  if (Math.random() < 0.7) {
    document.getElementById('combo-text').textContent = Math.floor(Math.random() * 30 + 5) + ' 连击';
  }
}

// ========== 完美一击 ==========
function triggerPerfect() {
  const container = document.getElementById('editor-container');
  const badge = document.getElementById('perfect-badge');
  const pContainer = document.getElementById('particles-container');
  // 金色边框
  container.classList.add('perfect-border');
  // 徽章
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth; // reflow
  badge.classList.add('perfect-badge');
  // 粒子
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  const colors = ['#FFD700', '#FF8C00', '#FFFF00', '#FFA500', '#FFF8DC'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 28) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const dist = 80 + Math.random() * 120;
    p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
    p.style.background = colors[i % colors.length];
    p.style.left = '50%';
    p.style.top = '50%';
    p.style.animationDelay = `${Math.random() * 0.3}s`;
    pContainer.appendChild(p);
  }
  // 3.5秒后清除
  setTimeout(() => {
    container.classList.remove('perfect-border');
    badge.classList.add('hidden');
    pContainer.classList.add('hidden');
  }, 4000);
}

function resetPerfect() {
  const container = document.getElementById('editor-container');
  container.classList.remove('perfect-border');
  document.getElementById('perfect-badge').classList.add('hidden');
  document.getElementById('particles-container').classList.add('hidden');
}

// ========== 折叠图表 ==========
document.getElementById('btn-collapse').addEventListener('click', () => {
  chartCollapsed = !chartCollapsed;
  document.getElementById('chart-body').classList.toggle('hidden', chartCollapsed);
  document.getElementById('btn-collapse').textContent = chartCollapsed ? '□' : '─';
});

// ========== 初始化 ==========
let startTime = Date.now();
renderCode();
updateChart();

// 自动模拟打字（每150ms打一个字）
let simInterval = setInterval(() => {
  if (cursor < TARGET.length) {
    typeChar();
  } else {
    clearInterval(simInterval);
  }
}, 180);
</script>
</body>
</html>
