<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CodeStep - 即时激励 UI 原型 v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

  /* ====================== */
  /* 效果 A：金边脉冲（原有） */
  /* ====================== */
  @keyframes golden-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.4); border-color: rgba(255,215,0,0.6); }
    50%       { box-shadow: 0 0 24px rgba(255,215,0,0.9), 0 0 48px rgba(255,165,0,0.5); border-color: rgba(255,215,0,1); }
  }
  .effect-A { border: 2px solid rgba(255,215,0,0.7); animation: golden-pulse 0.8s ease-in-out 4; }

  /* ====================== */
  /* 效果 B：全屏金光 + 粒子 */
  /* ====================== */
  @keyframes screen-flash {
    0%   { opacity: 0; }
    8%   { opacity: 0.7; }
    25%  { opacity: 0.15; }
    50%  { opacity: 0.05; }
    100% { opacity: 0; }
  }
  .screen-flash {
    position: fixed; inset: 0; z-index: 999;
    background: radial-gradient(ellipse at center, #FFD700 0%, rgba(255,215,0,0) 70%);
    animation: screen-flash 0.8s ease-out forwards;
    pointer-events: none;
  }

  @keyframes p2-burst {
    0%   { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.2); }
  }
  .p2-particle {
    position: fixed; z-index: 1000;
    width: var(--sz); height: var(--sz);
    animation: p2-burst var(--dur) var(--del) ease-out forwards;
    pointer-events: none;
  }

  /* ====================== */
  /* 效果 C：电弧/火花特效 */
  /* ====================== */
  @keyframes arc-flicker {
    0%,100% { opacity: 0; }
    5%  { opacity: 1; }
    15% { opacity: 0.3; }
    25% { opacity: 0.9; }
    35% { opacity: 0.2; }
    50% { opacity: 0.8; }
    70% { opacity: 0.4; }
    100%{ opacity: 0; }
  }
  .arc-container { position: absolute; inset: 0; pointer-events: none; z-index: 25; }
  .arc-line {
    stroke: url(#arcGrad);
    stroke-width: 2;
    stroke-linecap: round;
    fill: none;
    animation: arc-flicker 1.5s ease-out forwards;
    filter: drop-shadow(0 0 4px #60a5fa) drop-shadow(0 0 8px #93c5fd);
  }

  /* ====================== */
  /* 效果 D：同心圆波纹 */
  /* ====================== */
  @keyframes ripple-expand {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.9; }
    100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
  }
  .ripple-ring {
    position: absolute; z-index: 25;
    border-radius: 50%;
    border: 2px solid;
    animation: ripple-expand 1.4s ease-out forwards;
    pointer-events: none;
  }

  /* ====================== */
  /* 效果 E：屏幕微震 */
  /* ====================== */
  @keyframes screen-shake {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    10%  { transform: translate(-3px,-2px) rotate(-0.3deg); }
    20%  { transform: translate(3px,2px)  rotate(0.3deg); }
    30%  { transform: translate(-2px,3px) rotate(-0.2deg); }
    40%  { transform: translate(2px,-3px) rotate(0.2deg); }
    50%  { transform: translate(-3px,1px) rotate(-0.3deg); }
    60%  { transform: translate(3px,-2px) rotate(0.3deg); }
    70%  { transform: translate(-1px,3px) rotate(-0.1deg); }
    80%  { transform: translate(1px,-3px) rotate(0.1deg); }
    90%  { transform: translate(-2px,1px) rotate(-0.2deg); }
  }
  .effect-E-shake { animation: screen-shake 0.8s ease-out; }

  /* 震屏时的粒子 */
  @keyframes p5-burst {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0); }
  }
  .p5-particle {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    animation: p5-burst 1.2s ease-out forwards;
    pointer-events: none; z-index: 25;
  }

  /* ====================== */
  /* 效果 F：RGB 故障效果 */
  /* ====================== */
  @keyframes glitch-shift {
    0%,  100% { clip-path: none; transform: translate(0,0); filter: none; }
    5%         { clip-path: inset(10% 0 60% 0); transform: translate(-4px, 0); }
    10%        { clip-path: inset(50% 0 20% 0); transform: translate(4px, 0); filter: hue-rotate(90deg); }
    15%        { clip-path: inset(30% 0 40% 0); transform: translate(-2px, 0); }
    20%        { clip-path: none; transform: translate(2px, 0); filter: hue-rotate(-90deg); }
    25%, 100%  { clip-path: none; transform: translate(0,0); filter: none; }
  }
  .effect-F-glitch {
    animation: glitch-shift 0.8s ease-out;
    position: relative;
  }
  .effect-F-glitch::before,
  .effect-F-glitch::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    padding: 2.5rem; font-mono; font-size: 1.125rem; line-height: 1.75rem;
    overflow: hidden; pointer-events: none;
  }
  .effect-F-glitch::before {
    color: #ff0040;
    animation: glitch-shift 0.8s ease-out;
    clip-path: inset(0 0 80% 0);
    transform: translate(-3px, 0);
  }
  .effect-F-glitch::after {
    color: #00ffff;
    animation: glitch-shift 0.8s ease-out reverse;
    clip-path: inset(80% 0 0 0);
    transform: translate(3px, 0);
  }

  /* ====================== */
  /* 徽章入场 */
  /* ====================== */
  @keyframes badge-in {
    0%   { opacity: 0; transform: translateY(-30px) scale(0.7); }
    60%  { opacity: 1; transform: translateY(4px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .perfect-badge { animation: badge-in 0.5s ease-out forwards; }

  /* 滑动入场 */
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }

  /* 终点发光 */
  @keyframes dot-glow {
    0%, 100% { r: 3; opacity: 0.8; }
    50%       { r: 6; opacity: 1; }
  }

  /* ====================== */
  /* 图表增强：霓虹线条 */
  /* ====================== */
  .neon-wpm { stroke: #60a5fa; stroke-width: 2.5; filter: url(#neonBlue); }
  .neon-acc { stroke: #34d399; stroke-width: 2.5; stroke-dasharray: 4,3; filter: url(#neonGreen); }
  .neon-area-wpm { fill: url(#wpmGrad); }
  .neon-area-acc { fill: url(#accGrad); opacity: 0.12; }

  /* 图表增强：动态描边 */
  @keyframes draw-line {
    to { stroke-dashoffset: 0; }
  }
  .chart-animated .wpm-path,
  .chart-animated .acc-path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw-line 1.2s ease-out forwards;
  }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- 顶部导航 -->
<div class="flex items-center justify-between px-5 py-2.5 bg-gray-800/40 border-b border-gray-700/40 text-sm">
  <button class="text-gray-400 hover:text-gray-200 transition-colors">&larr; 退出</button>
  <span class="font-medium text-gray-300">Python 基础 — 变量与类型</span>
  <div class="flex items-center gap-1.5">
    <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
  </div>
</div>

<!-- 连击展示区 -->
<div id="combo-bar" class="flex items-center justify-center gap-3 py-2 bg-gray-900/50 border-b border-gray-700/30 transition-all duration-300">
  <span class="text-2xl font-bold text-blue-400 combo-glow-mid" id="combo-text">12 连击</span>
  <span class="text-xs text-gray-500" id="combo-label">高手</span>
</div>

<!-- 主内容区 -->
<div class="flex-1 flex overflow-hidden">

  <!-- 左侧：指令面板 -->
  <div class="w-72 flex-shrink-0 p-5 border-r border-gray-700/30 bg-gray-800/20 overflow-auto">
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-2">
        <span class="px-2 py-0.5 text-[11px] font-medium bg-blue-500/20 text-blue-300 rounded">步骤 2/8</span>
        <span class="px-2 py-0.5 text-[11px] font-medium bg-green-500/20 text-green-300 rounded">typing</span>
      </div>
      <h2 class="text-base font-semibold text-gray-100 mb-2">打印变量值</h2>
      <p class="text-sm text-gray-400 leading-relaxed">使用 <code class="text-xs bg-gray-700/60 px-1 py-0.5 rounded text-cyan-300">print()</code> 函数输出变量内容到控制台。</p>
    </div>
    <div class="p-3 rounded-lg bg-blue-500/5 border border-blue-500/20">
      <div class="text-xs text-blue-400 mb-1.5 font-medium">💡 提示</div>
      <p class="text-xs text-gray-400">注意括号和引号都是英文符号。</p>
    </div>

    <!-- 效果切换面板 -->
    <div class="mt-6 p-4 rounded-xl bg-gray-800/60 border border-gray-700/40">
      <div class="text-xs font-semibold text-gray-300 mb-3 uppercase tracking-wider">⚡ 完美一击效果</div>
      <div class="space-y-2">
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="perfect-effect" value="A" class="accent-yellow-400" checked>
          <span class="text-sm text-gray-300 group-hover:text-yellow-300 transition-colors">A. 金边脉冲</span>
          <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-700/60 text-gray-500">柔和</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="perfect-effect" value="B" class="accent-yellow-400">
          <span class="text-sm text-gray-300 group-hover:text-yellow-300 transition-colors">B. 全屏金光</span>
          <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-700/60 text-gray-500">强烈</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="perfect-effect" value="C" class="accent-yellow-400">
          <span class="text-sm text-gray-300 group-hover:text-yellow-300 transition-colors">C. 电弧火花</span>
          <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-700/60 text-gray-500">科技感</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="perfect-effect" value="D" class="accent-yellow-400">
          <span class="text-sm text-gray-300 group-hover:text-yellow-300 transition-colors">D. 同心波纹</span>
          <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-700/60 text-gray-500">优雅</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="perfect-effect" value="E" class="accent-yellow-400">
          <span class="text-sm text-gray-300 group-hover:text-yellow-300 transition-colors">E. 屏幕微震</span>
          <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-700/60 text-gray-500">硬核</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="perfect-effect" value="F" class="accent-yellow-400">
          <span class="text-sm text-gray-300 group-hover:text-yellow-300 transition-colors">F. RGB 故障</span>
          <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-gray-700/60 text-gray-500">赛博</span>
        </label>
      </div>

      <div class="text-xs font-semibold text-gray-300 mb-3 mt-5 uppercase tracking-wider">🎨 图表风格</div>
      <div class="space-y-2">
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="chart-style" value="v1" class="accent-blue-400" checked>
          <span class="text-sm text-gray-300 group-hover:text-blue-300 transition-colors">v1. 扁平线条</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="chart-style" value="v2" class="accent-blue-400">
          <span class="text-sm text-gray-300 group-hover:text-blue-300 transition-colors">v2. 霓虹发光线 + 渐变填充</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer group">
          <input type="radio" name="chart-style" value="v3" class="accent-blue-400">
          <span class="text-sm text-gray-300 group-hover:text-blue-300 transition-colors">v3. 动态描边动画</span>
        </label>
      </div>
    </div>
  </div>

  <!-- 右侧：编辑器 + 图表 + 完美一击 -->
  <div class="flex-1 flex flex-col relative" id="editor-container">

    <!-- 完美一击徽章（默认隐藏） -->
    <div id="perfect-badge" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-30 perfect-badge">
      <div class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-gradient-to-r from-yellow-500/90 to-amber-500/90 text-gray-900 font-bold text-sm shadow-lg shadow-yellow-500/30">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        完美一击！Perfect Strike!
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
      </div>
    </div>

    <!-- 粒子容器 -->
    <div id="particles-container" class="absolute inset-0 pointer-events-none z-20"></div>

    <!-- SVG defs (电弧渐变) -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="50%" stop-color="#FFD700"/>
          <stop offset="100%" stop-color="#f97316"/>
        </linearGradient>
        <!-- 图表霓虹滤镜 -->
        <filter id="neonBlue" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="neonGreen" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- 图表渐变 -->
        <linearGradient id="wpmGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="accGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- 右上角：WPM/准确率图表 -->
    <div class="absolute top-3 right-3 z-20 w-72 bg-gray-800/90 backdrop-blur-sm rounded-xl border border-gray-700/50 shadow-lg shadow-black/30 animate-slide-up">
      <div class="flex items-center justify-between px-3 py-2 border-b border-gray-700/30">
        <span class="text-xs font-medium text-gray-300">📈 实时表现</span>
        <button class="text-gray-500 hover:text-gray-300 text-xs" id="btn-collapse">─</button>
      </div>
      <div class="p-3" id="chart-body">
        <!-- v1: 扁平线条 -->
        <svg viewBox="0 0 220 100" class="w-full chart-base" id="chart-svg">
          <line x1="0" y1="25" x2="220" y2="25" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
          <line x1="0" y1="50" x2="220" y2="50" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
          <line x1="0" y1="75" x2="220" y2="75" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
          <!-- 渐变填充 v2 -->
          <polygon id="acc-area-v2" class="neon-area-acc" points=""/>
          <polygon id="wpm-area-v2" class="neon-area-wpm" points=""/>
          <!-- 折线 v1 -->
          <polyline id="wpm-line-v1" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
          <polyline id="acc-line-v1" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>
          <!-- 折线 v2 (霓虹) -->
          <polyline id="wpm-line-v2" class="neon-wpm" fill="none" stroke-linecap="round" visibility="hidden"/>
          <polyline id="acc-line-v2" class="neon-acc" fill="none" stroke-linecap="round" visibility="hidden"/>
          <!-- 折线 v3 (动态) -->
          <polyline id="wpm-line-v3" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" visibility="hidden"/>
          <polyline id="acc-line-v3" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3" visibility="hidden"/>
          <!-- 终点圆点 WPM -->
          <circle id="wpm-dot" cx="0" cy="0" fill="#3b82f6">
            <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
          </circle>
          <!-- 终点圆点 ACC -->
          <circle id="acc-dot" cx="0" cy="0" fill="#10b981">
            <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
          </circle>
          <!-- 标签 -->
          <text x="4" y="22" fill="#3b82f6" font-size="9" font-weight="bold" id="label-wpm">WPM</text>
          <text x="4" y="95" fill="#10b981" font-size="9" font-weight="bold" id="label-acc">ACC%</text>
        </svg>
        <div class="flex items-center justify-between mt-1.5 text-xs">
          <span class="text-blue-400 font-bold" id="wpm-now">— WPM</span>
          <span class="text-green-400 font-bold" id="acc-now">—% ACC</span>
        </div>
      </div>
    </div>

    <!-- 代码编辑区 -->
    <div class="flex-1 overflow-auto p-5 font-mono text-lg leading-relaxed cursor-text bg-gray-900/20" id="code-area">
      <div id="code-render" class="whitespace-pre-wrap"></div>
    </div>

    <!-- 底部统计 -->
    <div class="px-5 py-2 bg-gray-800/40 border-t border-gray-700/30 flex items-center gap-5 text-xs text-gray-400">
      <span>WPM: <span class="text-blue-400 font-semibold" id="stat-wpm">0</span></span>
      <span>准确率: <span class="text-green-400 font-semibold" id="stat-acc">100%</span></span>
      <span>错误: <span class="text-red-400 font-semibold" id="stat-err">0</span></span>
      <span class="ml-auto">进度: <span id="stat-progress">0/36</span></span>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="flex items-center justify-between px-5 py-2 bg-gray-800/40 border-t border-gray-700/40 text-sm">
  <button class="text-gray-400 hover:text-gray-200 disabled:opacity-30" disabled>← 上一步</button>
  <span class="text-gray-500 text-xs">2 / 8</span>
  <button class="text-gray-400 hover:text-gray-200" id="btn-next">下一步 →</button>
</div>

<!-- 操作按钮区 -->
<div class="fixed bottom-20 left-1/2 -translate-x-1/2 flex gap-3 z-40">
  <button onclick="triggerPerfect()" class="px-4 py-2 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 rounded-lg border border-yellow-500/30 text-sm font-medium transition-all">
    ⭐ 触发完美一击（当前效果）
  </button>
  <button onclick="resetPerfect()" class="px-4 py-2 bg-gray-700/50 hover:bg-gray-700/70 text-gray-300 rounded-lg border border-gray-600/40 text-sm font-medium transition-all">
    ♻️ 重置
  </button>
</div>

<!-- 当前效果名称 -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 text-xs text-gray-500 z-40" id="effect-label">
  当前效果：A. 金边脉冲
</div>

<script>
// ========== 数据模拟 ==========
const TARGET = 'print(x)\nprint(y)\nprint("Hello")';
let typed = '';
let cursor = 0;
let wpmHistory = [];
let accHistory = [];
let correctCount = 0;
let totalCount = 0;
let chartCollapsed = false;
let currentEffect = 'A';
let currentChart = 'v1';
let perfectTriggered = false;

// 初始化图表假数据
for (let i = 0; i < 30; i++) {
  const t = i / 29;
  wpmHistory.push(Math.round(30 + 50 * Math.sin(t * 3) * (0.5 + t * 0.5) + Math.random() * 10));
  accHistory.push(Math.round(85 + 15 * (t * t) + Math.random() * 5));
}
wpmHistory = wpmHistory.map(v => Math.min(v, 120));
accHistory = accHistory.map(v => Math.min(v, 100));

// ========== 渲染代码 ==========
function renderCode() {
  const el = document.getElementById('code-render');
  let html = '';
  for (let i = 0; i < TARGET.length; i++) {
    const ch = TARGET[i];
    const isTyped = i < typed.length;
    const isCurrent = i === cursor;
    const isCorrect = isTyped && typed[i] === ch;
    const isWrong = isTyped && typed[i] !== ch;
    let cls = 'text-gray-500';
    if (isCorrect) cls = 'text-green-400';
    else if (isWrong) cls = 'text-red-400 bg-red-500/20';
    else if (isCurrent) cls = 'text-gray-200 bg-blue-500/30';
    let display = ch === '\n' ? '↵\n' : ch === ' ' ? '·' : ch;
    html += `<span class="${cls}">${display}</span>`;
  }
  el.innerHTML = html;
}

// ========== 更新图表 ==========
function updateChart(animate = false) {
  const w = 220, h = 100;
  const pad = 8;

  function makePts(data, max) {
    return data.map((v, i) => {
      const x = pad + (i / (data.length - 1)) * (w - pad * 2);
      const y = pad + (1 - v / max) * (h - pad * 2);
      return [x, y];
    });
  }

  const wpmPts = makePts(wpmHistory, 130);
  const accPts = makePts(accHistory, 100);

  function ptsToStr(arr) { return arr.map(p => p.join(',')).join(' '); }

  // v1
  document.getElementById('wpm-line-v1').setAttribute('points', ptsToStr(wpmPts));
  document.getElementById('acc-line-v1').setAttribute('points', ptsToStr(accPts));

  // v2 (霓虹 + 填充)
  if (currentChart === 'v2') {
    const wpmBottom = wpmPts.map(p => [p[0], h - pad]);
    const wpmArea = [...wpmPts, ...wpmBottom.reverse()];
    document.getElementById('wpm-area-v2').setAttribute('points', wpmArea.map(p=>p.join(',')).join(' '));
    const accBottom = accPts.map(p => [p[0], h - pad]);
    const accArea = [...accPts, ...accBottom.reverse()];
    document.getElementById('acc-area-v2').setAttribute('points', accArea.map(p=>p.join(',')).join(' '));
  }

  document.getElementById('wpm-line-v2').setAttribute('points', ptsToStr(wpmPts));
  document.getElementById('acc-line-v2').setAttribute('points', ptsToStr(accPts));
  document.getElementById('wpm-line-v3').setAttribute('points', ptsToStr(wpmPts));
  document.getElementById('acc-line-v3').setAttribute('points', ptsToStr(accPts));

  // 终点
  const last = wpmPts[wpmPts.length - 1];
  const lastAcc = accPts[accPts.length - 1];
  document.getElementById('wpm-dot').setAttribute('cx', last[0]);
  document.getElementById('wpm-dot').setAttribute('cy', last[1]);
  document.getElementById('acc-dot').setAttribute('cx', lastAcc[0]);
  document.getElementById('acc-dot').setAttribute('cy', lastAcc[1]);

  document.getElementById('wpm-now').textContent = `${wpmHistory[wpmHistory.length-1]} WPM`;
  document.getElementById('acc-now').textContent = `${accHistory[accHistory.length-1]}% ACC`;
}

// ========== 图表样式切换 ==========
function applyChartStyle(style) {
  currentChart = style;
  const v1lines = document.querySelectorAll('#wpm-line-v1,#acc-line-v1');
  const v2lines = document.querySelectorAll('#wpm-line-v2,#acc-line-v2');
  const v2areas = document.querySelectorAll('#wpm-area-v2,#acc-area-v2');
  const v3lines = document.querySelectorAll('#wpm-line-v3,#acc-line-v3');
  const dot = document.getElementById('wpm-dot');
  const dotA = document.getElementById('acc-dot');
  const labelW = document.getElementById('label-wpm');
  const labelA = document.getElementById('label-acc');

  [v1lines, v2lines, v2areas, v3lines].forEach(g => g.forEach(el => el.setAttribute('visibility', 'hidden')));
  dot.setAttribute('fill', '#3b82f6');
  dotA.setAttribute('fill', '#10b981');
  labelW.setAttribute('fill', '#3b82f6');
  labelA.setAttribute('fill', '#10b981');

  if (style === 'v1') {
    v1lines.forEach(el => el.setAttribute('visibility', 'visible'));
  } else if (style === 'v2') {
    v2lines.forEach(el => el.setAttribute('visibility', 'visible'));
    v2areas.forEach(el => el.setAttribute('visibility', 'visible'));
    dot.setAttribute('fill', '#60a5fa');
    dotA.setAttribute('fill', '#34d399');
    labelW.setAttribute('fill', '#60a5fa');
    labelA.setAttribute('fill', '#34d399');
  } else if (style === 'v3') {
    v3lines.forEach(el => el.setAttribute('visibility', 'visible'));
    dot.setAttribute('fill', '#818cf8');
    dotA.setAttribute('fill', '#2dd4bf');
    labelW.setAttribute('fill', '#818cf8');
    labelA.setAttribute('fill', '#2dd4bf');
    // 触发动画
    document.querySelectorAll('#wpm-line-v3,#acc-line-v3').forEach(el => {
      el.style.strokeDasharray = el.getAttribute('points').split(' ').length * 8;
      el.style.strokeDashoffset = el.style.strokeDasharray;
      el.getBoundingClientRect();
      el.style.transition = 'stroke-dashoffset 1.2s ease-out';
      el.style.strokeDashoffset = '0';
    });
  }
  updateChart();
}

// ========== 效果切换 ==========
document.querySelectorAll('input[name="perfect-effect"]').forEach(radio => {
  radio.addEventListener('change', e => {
    currentEffect = e.target.value;
    const labels = {
      A: 'A. 金边脉冲', B: 'B. 全屏金光', C: 'C. 电弧火花',
      D: 'D. 同心波纹', E: 'E. 屏幕微震', F: 'F. RGB 故障'
    };
    document.getElementById('effect-label').textContent = `当前效果：${labels[currentEffect]}`;
  });
});
document.querySelectorAll('input[name="chart-style"]').forEach(radio => {
  radio.addEventListener('change', e => applyChartStyle(e.target.value));
});

// ========== 模拟打字 ==========
function typeChar() {
  if (cursor >= TARGET.length) return;
  const expected = TARGET[cursor];
  const isCorrect = Math.random() < 0.9;
  if (isCorrect) { typed += expected; correctCount++; }
  else { typed += expected === '(' ? ')' : expected === '"' ? "'" : 'a'; }
  totalCount++;
  cursor++;
  renderCode();
  updateStats();
  if (cursor % 3 === 0 && wpmHistory.length < 60) {
    const wpm = Math.round(30 + Math.random() * 80 + (cursor / TARGET.length) * 30);
    const acc = Math.round((correctCount / totalCount) * 100);
    wpmHistory.push(Math.min(wpm, 130));
    accHistory.push(Math.min(acc, 100));
    updateChart();
  }
  if (cursor >= TARGET.length && !perfectTriggered) {
    perfectTriggered = true;
    setTimeout(triggerPerfect, 400);
  }
}

function updateStats() {
  const acc = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 100;
  const wpm = Math.round(correctCount / Math.max(1, (Date.now()-startTime)/5000) * 12);
  document.getElementById('stat-wpm').textContent = Math.min(wpm, 120);
  document.getElementById('stat-acc').textContent = acc + '%';
  document.getElementById('stat-err').textContent = totalCount - correctCount;
  document.getElementById('stat-progress').textContent = `${cursor}/${TARGET.length}`;
  if (Math.random() < 0.7) {
    document.getElementById('combo-text').textContent = Math.floor(Math.random() * 30 + 5) + ' 连击';
  }
}

// ========== 完美一击 ==========
function triggerPerfect() {
  resetPerfect();
  const container = document.getElementById('editor-container');
  const badge = document.getElementById('perfect-badge');
  const pContainer = document.getElementById('particles-container');

  switch (currentEffect) {
    case 'A': triggerEffectA(container, badge, pContainer); break;
    case 'B': triggerEffectB(container, badge, pContainer); break;
    case 'C': triggerEffectC(container, badge, pContainer); break;
    case 'D': triggerEffectD(container, badge, pContainer); break;
    case 'E': triggerEffectE(container, badge, pContainer); break;
    case 'F': triggerEffectF(container, badge, pContainer); break;
  }
}

function triggerEffectA(container, badge, pContainer) {
  container.classList.add('effect-A');
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth;
  badge.classList.add('perfect-badge');
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  const colors = ['#FFD700','#FF8C00','#FFFF00','#FFA500','#FFF8DC'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i/28)*Math.PI*2+(Math.random()-0.5)*0.5;
    const dist = 80+Math.random()*120;
    p.style.setProperty('--tx',`${Math.cos(angle)*dist}px`);
    p.style.setProperty('--ty',`${Math.sin(angle)*dist}px`);
    p.style.cssText += `position:absolute;left:50%;top:50%;background:${colors[i%5]};animation-delay:${Math.random()*0.3}s;`;
    pContainer.appendChild(p);
  }
  setTimeout(() => { container.classList.remove('effect-A'); badge.classList.add('hidden'); pContainer.classList.add('hidden'); }, 4000);
}

function triggerEffectB(container, badge, pContainer) {
  // 全屏金光
  const flash = document.createElement('div');
  flash.className = 'screen-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1000);

  // 徽章
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth;
  badge.classList.add('perfect-badge');

  // 大型粒子爆炸
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  const shapes = ['circle','square'];
  const colorsB = ['#FFD700','#FF6B35','#FF2D55','#FFFF00','#FF9500','#FFFFFF','#FFE066'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    const shape = shapes[i % 2];
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 250;
    const size = 4 + Math.random() * 10;
    p.style.cssText = [
      `position:fixed`,
      `left:50vw`, `top:50vh`,
      `width:${size}px`, `height:${size}px`,
      `background:${colorsB[i%colorsB.length]}`,
      shape === 'circle' ? `border-radius:50%` : `border-radius:2px`,
      `--tx:${Math.cos(angle)*dist}px`,
      `--ty:${Math.sin(angle)*dist}px`,
      `--dur:1.4s`, `--del:${Math.random()*0.4}s`,
      `z-index:1000`,
      `pointer-events:none`,
    ].join(';');
    p.className = 'p2-particle';
    p.style.animation = `p2-burst var(--dur) var(--del) ease-out forwards`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }

  setTimeout(() => { badge.classList.add('hidden'); pContainer.classList.add('hidden'); }, 4000);
}

function triggerEffectC(container, badge, pContainer) {
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth;
  badge.classList.add('perfect-badge');

  // 电弧 SVG
  const codeArea = document.getElementById('code-area');
  const rect = codeArea.getBoundingClientRect();
  const svgNS = 'http://www.w3.org/2000/svg';
  const arcSvg = document.createElementNS(svgNS, 'svg');
  arcSvg.setAttribute('width', rect.width);
  arcSvg.setAttribute('height', rect.height);
  arcSvg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:26;';
  arcSvg.innerHTML = '<defs><linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs>';
  codeArea.style.position = 'relative';
  codeArea.appendChild(arcSvg);

  // 生成多条电弧
  for (let arc = 0; arc < 8; arc++) {
    const path = document.createElementNS(svgNS, 'path');
    const cx = rect.width / 2 + (Math.random()-0.5)*rect.width*0.4;
    const cy = rect.height / 2 + (Math.random()-0.5)*rect.height*0.3;
    let d = `M ${cx} ${cy} `;
    const segs = 6 + Math.floor(Math.random()*4);
    for (let s = 1; s <= segs; s++) {
      const nx = cx + (Math.random()-0.5)*rect.width*0.4;
      const ny = cy + (Math.random()-0.5)*rect.height*0.3;
      d += `L ${nx} ${ny} `;
    }
    path.setAttribute('d', d);
    path.setAttribute('stroke', `hsl(${200+Math.random()*60}, 100%, ${60+Math.random()*30}%)`);
    path.setAttribute('stroke-width', 1.5 + Math.random()*2);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.style.cssText = `animation:arc-flicker 1.5s ${arc*0.08}s ease-out forwards;filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 8px currentColor);`;
    arcSvg.appendChild(path);
  }

  // 小型金色粒子
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  const colorsC = ['#60a5fa','#93c5fd','#FFD700','#fbbf24'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    const angle = Math.random()*Math.PI*2;
    const dist = 60+Math.random()*100;
    p.style.cssText = `position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:${colorsC[i%4]};`;
    p.style.setProperty('--tx',`${Math.cos(angle)*dist}px`);
    p.style.setProperty('--ty',`${Math.sin(angle)*dist}px`);
    p.className = 'particle';
    p.style.animationDelay = `${Math.random()*0.5}s`;
    pContainer.appendChild(p);
  }

  setTimeout(() => {
    arcSvg.remove();
    badge.classList.add('hidden');
    pContainer.classList.add('hidden');
  }, 4000);
}

function triggerEffectD(container, badge, pContainer) {
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth;
  badge.classList.add('perfect-badge');

  const codeArea = document.getElementById('code-area');
  codeArea.style.position = 'relative';
  codeArea.style.overflow = 'hidden';

  const colorsD = [
    'rgba(251,191,36,0.8)',  // 金
    'rgba(255,255,255,0.6)',  // 白
    'rgba(251,191,36,0.5)',  // 金淡
  ];
  const cx = codeArea.offsetWidth / 2;
  const cy = codeArea.offsetHeight / 2;

  for (let r = 0; r < 5; r++) {
    const ring = document.createElement('div');
    ring.className = 'ripple-ring';
    ring.style.cssText = [
      `position:absolute`,
      `left:${cx}px`, `top:${cy}px`,
      `width:${80+r*60}px`, `height:${80+r*60}px`,
      `border-color:${colorsD[r%3]}`,
      `border-width:${r===0?3:1.5}px`,
      `animation-delay:${r*0.15}s`,
    ].join(';');
    codeArea.appendChild(ring);
    setTimeout(() => ring.remove(), 2000);
  }

  // 中心小粒子
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    const angle = (i/12)*Math.PI*2;
    const dist = 40+Math.random()*60;
    p.style.cssText = `position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#FFD700;`;
    p.style.setProperty('--tx',`${Math.cos(angle)*dist}px`);
    p.style.setProperty('--ty',`${Math.sin(angle)*dist}px`);
    p.className = 'particle';
    pContainer.appendChild(p);
  }

  setTimeout(() => { badge.classList.add('hidden'); pContainer.classList.add('hidden'); }, 4000);
}

function triggerEffectE(container, badge, pContainer) {
  // 屏幕微震
  const codeArea = document.getElementById('code-area');
  codeArea.classList.add('effect-E-shake');

  // 边缘金色粒子飞溅
  const rect = codeArea.getBoundingClientRect();
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  const colorsE = ['#FFD700','#FF8C00','#FFFF00','#FF4500','#FF6347'];
  const positions = [
    {x: 0, y: rect.height*0.3, dx: 1, dy: 0},
    {x: rect.width, y: rect.height*0.5, dx: -1, dy: 0},
    {x: rect.width*0.4, y: 0, dx: 0, dy: 1},
    {x: rect.width*0.6, y: 0, dx: 0, dy: 1},
    {x: rect.width*0.2, y: rect.height, dx: 0.5, dy: -1},
    {x: rect.width*0.8, y: rect.height, dx: -0.5, dy: -1},
  ];
  positions.forEach((pos, pi) => {
    for (let j = 0; j < 6; j++) {
      const p = document.createElement('div');
      const dist = 80+Math.random()*150;
      p.className = 'p5-particle';
      p.style.cssText = `left:${pos.x}px;top:${pos.y}px;background:${colorsE[(pi+j)%5]};width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;`;
      p.style.setProperty('--tx',`${pos.dx*dist+(Math.random()-0.5)*60}px`);
      p.style.setProperty('--ty',`${pos.dy*dist+(Math.random()-0.5)*60}px`);
      p.style.animationDelay = `${j*0.05}s`;
      pContainer.appendChild(p);
    }
  });

  // 徽章
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth;
  badge.classList.add('perfect-badge');

  setTimeout(() => {
    codeArea.classList.remove('effect-E-shake');
    badge.classList.add('hidden');
    pContainer.classList.add('hidden');
  }, 4000);
}

function triggerEffectF(container, badge, pContainer) {
  // RGB 故障
  const codeArea = document.getElementById('code-area');
  const text = codeArea.innerText || codeArea.textContent;
  codeArea.classList.add('effect-F-glitch');
  codeArea.setAttribute('data-text', text);

  // 故障线条
  pContainer.classList.remove('hidden');
  pContainer.innerHTML = '';
  const glitchColors = ['#ff0040','#00ffff','#ff00ff','#00ff00'];
  for (let i = 0; i < 8; i++) {
    const line = document.createElement('div');
    line.style.cssText = [
      `position:absolute`,
      `left:0`, `right:0`,
      `top:${10+i*8+Math.random()*20}%`,
      `height:${2+Math.random()*4}px`,
      `background:${glitchColors[i%glitchColors.length]}`,
      `opacity:${0.3+Math.random()*0.5}`,
      `animation:arc-flicker ${0.3+Math.random()*0.5}s ${Math.random()*0.2}s ease-out forwards`,
      `pointer-events:none`, `z-index:28`,
    ].join(';');
    pContainer.appendChild(line);
  }

  // 徽章
  badge.classList.remove('hidden');
  badge.classList.remove('perfect-badge');
  void badge.offsetWidth;
  badge.classList.add('perfect-badge');

  setTimeout(() => {
    codeArea.classList.remove('effect-F-glitch');
    badge.classList.add('hidden');
    pContainer.classList.add('hidden');
  }, 4000);
}

function resetPerfect() {
  const container = document.getElementById('editor-container');
  const codeArea = document.getElementById('code-area');
  container.classList.remove('effect-A');
  codeArea.classList.remove('effect-E-shake','effect-F-glitch');
  document.getElementById('perfect-badge').classList.add('hidden');
  document.getElementById('particles-container').classList.add('hidden');
  document.querySelectorAll('.screen-flash').forEach(el => el.remove());
  perfectTriggered = false;
}

// ========== 折叠图表 ==========
document.getElementById('btn-collapse').addEventListener('click', () => {
  chartCollapsed = !chartCollapsed;
  document.getElementById('chart-body').classList.toggle('hidden', chartCollapsed);
  document.getElementById('btn-collapse').textContent = chartCollapsed ? '□' : '─';
});

// ========== 初始化 ==========
let startTime = Date.now();
renderCode();
applyChartStyle('v1');
updateChart();

// 自动模拟打字
let simInterval = setInterval(() => {
  if (cursor < TARGET.length) typeChar();
  else clearInterval(simInterval);
}, 180);
</script>
</body>
