<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/app-icon.png" />
    <meta name="theme-color" content="#0a1120" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeStep - 一步步学编程</title>
    <style>
      /* 防止白屏的加载动画 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a1120; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .loader-text {
        color: #9CA3AF;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #293247;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* React 挂载后隐藏加载器 */
      .app-loaded .loader { display: none; }
    </style>
  </head>
  <body class="bg-bg-app text-text-primary">
    <div id="root">
      <!-- 加载动画（React 挂载后会被替换） -->
      <div class="loader" role="status" aria-live="polite">
        <img src="/src/assets/app-icon.png" width="64" height="64" alt="" />
        <div class="spinner" aria-hidden="true"></div>
        <span class="loader-text">CodeStep 加载中...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
