name: Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送 v 开头的 tag

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release for Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install system dependencies (Windows)
        run: |
          # 安装 WebView2 (Tauri v2 需要)
          # 通常 Windows 镜像已包含，但确保安装构建工具
          choco install -y wixtoolset --no-progress
        shell: pwsh

      - name: Install npm dependencies
        run: npm ci

      - name: Update version from tag
        run: |
          $VERSION = "${{ github.ref_name }}".Substring(1)
          echo "Setting version to $VERSION"
          
          # 更新 tauri.conf.json
          $config = Get-Content "src-tauri/tauri.conf.json" -Encoding UTF8 | ConvertFrom-Json
          $config.version = $VERSION
          $config | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          
          # 更新 Cargo.toml
          (Get-Content "src-tauri/Cargo.toml" -Encoding UTF8) -replace '^version = ".*"$', "version = `"$VERSION`"" | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          
          # 更新 package.json
          $package = Get-Content "package.json" -Encoding UTF8 | ConvertFrom-Json
          $package.version = $VERSION
          $package | ConvertTo-Json -Depth 10 | Set-Content "package.json" -Encoding UTF8
          
          Write-Host "Versions updated to $VERSION"
        shell: pwsh

      - name: Build Tauri app
        run: npm run tauri build
        env:
          RUST_BACKTRACE: 1

      - name: List build artifacts
        run: |
          Write-Host "=== Build Artifacts ==="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No bundle directory found"
            Get-ChildItem -Path "src-tauri/target/release" -File | ForEach-Object { Write-Host $_.FullName }
          }
        shell: pwsh

      - name: Extract changelog for this release
        id: changelog
        run: |
          $VERSION = "${{ github.ref_name }}".Substring(1)   # 去掉前缀 "v"
          $content = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
          
          # 匹配当前版本区块：从 "## [X.Y.Z]" 到下一个 "## [" 之间的内容
          $pattern = "(?s)## \[$VERSION\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          $match = [regex]::Match($content, $pattern)
          
          if ($match.Success) {
            $CHANGELOG = $match.Groups[1].Value.Trim()
          } else {
            $CHANGELOG = "请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) 获取更新详情。"
          }
          
          # 写入 GITHUB_OUTPUT（多行内容用 EOF 分隔）
          echo "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          echo $CHANGELOG >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
          
          # 计算对比链接用的上一个 tag
          $PREV_TAG = git describe --tags --abbrev=0 HEAD^ 2>$null
          if (-not $PREV_TAG) { $PREV_TAG = "v0.1.0" }
          echo "PREV_TAG=$PREV_TAG" >> $env:GITHUB_OUTPUT
          
          Write-Host "Version: $VERSION | Prev tag: $PREV_TAG"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CodeStep ${{ github.ref_name }}
          body: |
            ## 🎉 CodeStep ${{ github.ref_name }}

            ### 📝 更新日志
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ### 📦 下载说明
            - **Windows**:
              - `.msi` - Windows Installer 安装包（推荐）
              - `.exe` - NSIS 安装包
            1. 下载适合你系统的安装包
            2. 运行安装程序，按向导完成安装

            **完整 Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.PREV_TAG }}...${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            src-tauri/target/release/build/**/output
            src-tauri/target/release/build/**/stderr
          retention-days: 7
